[tool.pytest.ini_options]
markers = [
    "slow: end-to-end work that costs seconds to minutes - loading real SAM2 weights, or running the layout search over real contours",
]
# gridfinity-rebuilt-openscad is a separate project vendored in as a
# submodule, not part of this one - don't collect its tests.
norecursedirs = ["gridfinity-rebuilt-openscad", ".venv", "__pycache__"]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
exclude = [
    "gridfinity-rebuilt-openscad",
    "**/__pycache__", "**/node_modules", "**/.*", ".venv",
]
